# ONE TRIGGER, WHOLE CHAIN — the "A prepared" half of operator decision 27
# (hugmesh-generator#347, 2026-09-17).
#
# net.hugmesh is four repos that depend on each other at build time, in this order:
#
#     hugmesh-build-config 0.5.0   (no net.hugmesh parent; the analysers' ruleset jar)
#       -> hugmesh-parent 2.8.0    (metapom; needs build-config on the plugin classpath)
#         -> hugmesh-commons 2.1.0 (jar AND the `tests` classifier)
#           -> hugmesh-auth-core   (this repo)
#
# Each link's own Release workflow is workflow_dispatch-only and publishes exactly one
# repo. This workflow fires all four in order and waits for each to finish, so launch day
# is one button rather than four buttons in an order nobody remembers.
#
# IT IS INERT WITHOUT A SECRET, ON PURPOSE. secrets.GITHUB_TOKEN is scoped to THIS
# repository and cannot dispatch a workflow in hugmesh-build-config / hugmesh-parent /
# hugmesh-commons. Cross-repo dispatch needs an org-level PAT in RELEASE_CHAIN_TOKEN with
# Actions: read and write on all four repos (fine-grained), or classic `repo` + `workflow`.
# Until that secret exists this workflow fails on its first step with that message — it
# does not half-publish.
#
# BEFORE RUNNING IT, READ RELEASING.md section 6. The chain cannot succeed while these
# repos are private for a reason that has nothing to do with this file: as of 2026-09-17 no
# Actions job in this org starts at all. Measured on hugmesh-generator run 35288155335,
# job 105424969429, whose only annotation is "The job was not started because recent
# account payments have failed or your spending limit needs to be increased."
name: Release chain

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm. This publishes four immutable coordinates.'
        required: true
        default: ''
      ref:
        description: 'Git ref to publish from in every repo (default: each repo default branch)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm and check the cross-repo credential
        env:
          CONFIRM: ${{ inputs.confirm }}
          CHAIN_TOKEN: ${{ secrets.RELEASE_CHAIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "PUBLISH" ]; then
            echo "::error::confirm input was '${CONFIRM}', expected PUBLISH. Nothing dispatched."
            exit 1
          fi
          if [ -z "${CHAIN_TOKEN}" ]; then
            echo "::error::secret RELEASE_CHAIN_TOKEN is not set. secrets.GITHUB_TOKEN is scoped to this repository and cannot dispatch a workflow in hugmesh-build-config, hugmesh-parent or hugmesh-commons. Create a PAT with Actions read+write on all four repos and store it as RELEASE_CHAIN_TOKEN (org secret, or a repo secret here). Nothing dispatched."
            exit 1
          fi
          echo "confirmed; cross-repo credential present"

      - name: Publish the chain in order
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CHAIN_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # Order is the build-time dependency order. Changing it publishes a link before
          # the artifacts it resolves against exist, and the failure surfaces as an
          # unrelated-looking "Could not resolve net.hugmesh:..." three steps later.
          REPOS="hugmesh/hugmesh-build-config hugmesh/hugmesh-parent hugmesh/hugmesh-commons hugmesh/hugmesh-auth-core"
          WORKFLOW="release.yml"

          for repo in $REPOS; do
            ref="$INPUT_REF"
            if [ -z "$ref" ]; then
              ref=$(gh api "repos/$repo" --jq .default_branch)
            fi
            echo "::group::$repo @ $ref"

            # Record the newest existing run id FIRST. Polling for "the newest run" right
            # after a dispatch races the API and can latch onto a previous run that is
            # already completed, reporting success for work that never started.
            before=$(gh api "repos/$repo/actions/workflows/$WORKFLOW/runs?per_page=1" --jq '.workflow_runs[0].id // 0')

            gh workflow run "$WORKFLOW" --repo "$repo" --ref "$ref"

            run_id=0
            for _ in $(seq 1 60); do
              sleep 5
              candidate=$(gh api "repos/$repo/actions/workflows/$WORKFLOW/runs?per_page=1" --jq '.workflow_runs[0].id // 0')
              if [ "$candidate" != "$before" ] && [ "$candidate" != "0" ]; then
                run_id="$candidate"
                break
              fi
            done
            if [ "$run_id" = "0" ]; then
              echo "::error::$repo: dispatched $WORKFLOW but no new run appeared within 5 minutes. Chain stopped BEFORE $repo published; the links before it are already published and are immutable."
              exit 1
            fi
            echo "$repo run: https://github.com/$repo/actions/runs/$run_id"

            # Wait for it. `gh run watch --exit-status` exits non-zero on failure, which
            # under `set -e` stops the chain at the first broken link rather than
            # publishing the rest on top of a hole.
            gh run watch "$run_id" --repo "$repo" --exit-status --interval 15
            echo "::endgroup::"
          done

          echo "chain complete: all four coordinates published"
