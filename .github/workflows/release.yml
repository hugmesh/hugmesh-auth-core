# Release: build/test hugmesh-auth-core and publish the library jar to GitHub Packages
# (Maven registry). Mirrors the build:test + deploy:maven stages in this repo's
# .gitlab-ci.yml, ported to the GitHub Packages Maven registry for the hugmesh org.
#
# WHEN IT PUBLISHES (beta scheme, 2026-10-21). The git TAG is the publish decision:
#
#   push of tag v<version>            verify, then deploy <version>, then a cosign
#                                     keyless signature + build-provenance attestation
#                                     over the published jar and pom, then a GitHub
#                                     Release (with SHA256SUMS + signature; prerelease,
#                                     never "latest" for a beta)
#   workflow_dispatch on a v* tag     the same; this is the re-run path
#   workflow_dispatch on main         verify only; nothing is deployed
#   anything else                     refused by the version guard
#
# There is NO push-to-branch trigger. A Maven coordinate is immutable: publishing on every
# merge is what made 2.4.1 a mutable coordinate and forced the 2.4.2 re-pin. The tag must
# equal pom.xml's <version> exactly, the version must not be a -SNAPSHOT, and a version that
# is already in the registry is refused rather than overwritten.
#
# There is no pull_request trigger either, ever. Every job picks its runner with the same
# expression: the self-hosted runner named by the repository variable RUNS_ON_PUBLISH (a
# JSON array such as ["self-hosted","Linux","X64"]) only for a non-PR event on main or a
# v* tag; hosted ubuntu-latest otherwise, and also whenever RUNS_ON_PUBLISH is unset.
# Deleting RUNS_ON_PUBLISH is the off switch for the local runner.
#
# READ RELEASING.md BEFORE TAGGING. This is the LAST link of a four-repo chain
# (build-config 0.6.0-beta.1 -> parent 2.9.0-beta.1 -> commons 2.2.0-beta.1 ->
# auth-core 2.6.0-beta.1); running it before its upstreams are published fails at parent
# resolution, in `Build and test`, before the deploy step is reached.
# .github/workflows/release-chain.yml re-runs the unpublished links in order.
#
# Operator decision 27 (hugmesh-generator#347, 2026-09-17): "B for the mechanism, A
# prepared" — the source-build mechanism (m2-bootstrap.sh from pinned SHAs) is unchanged
# and stays the way the compose lane builds this library.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # VERSION GUARD. Decides what this run is allowed to do, before anything is built.
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version guard
        id: guard
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The project's OWN <version>: the direct child of <project>, never <parent>'s.
          version=$(python3 -c 'import sys, xml.etree.ElementTree as ET
          v = ET.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version")
          sys.exit("pom.xml declares no project-level <version>") if v is None else print(v.text.strip())')
          echo "pom.xml version: ${version}"
          case "${version}" in
            *-SNAPSHOT)
              echo "::error::pom.xml version ${version} is a SNAPSHOT. A published coordinate is immutable; set a real version (for example 2.6.0-beta.1) first."
              exit 1
              ;;
          esac
          if [ "${REF_TYPE}" = "tag" ] && [ "${REF}" = "refs/tags/${REF_NAME}" ] && [ "${REF_NAME#v}" != "${REF_NAME}" ]; then
            if [ "${REF_NAME#v}" != "${version}" ]; then
              echo "::error::tag ${REF_NAME} does not match pom.xml version ${version}. Tag v${version}, or fix pom.xml, README.md and CHANGELOG.md first. Nothing published."
              exit 1
            fi
            kind=release
          elif [ "${REF}" = "refs/heads/main" ]; then
            kind=main
          else
            echo "::error::this workflow runs only on main (verify only) or on a v<version> tag (publish). Got ${REF}. Nothing published."
            exit 1
          fi
          case "${version}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "kind=${kind} prerelease=${prerelease}"
          {
            echo "version=${version}"
            echo "kind=${kind}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
      # The two below exist only for the signing steps after the deploy:
      # id-token for the keyless cosign signature and the attestation's
      # Sigstore certificate, attestations to store the provenance on GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A job-private local repository. On the self-hosted runner ~/.m2 is a person's own
      # Maven cache: an upstream they built by hand there would satisfy this build without
      # ever proving the registry holds it, and `deploy` would install this jar into it.
      # RUNNER_TEMP is emptied after every job. This is also why setup-java's `cache: maven`
      # is not used: on a self-hosted runner it restores an archive over that same ~/.m2.
      - name: Use a job-private Maven repository
        run: echo "MAVEN_LOCAL_REPO=${RUNNER_TEMP}/m2-repository" >> "${GITHUB_ENV}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          # NOTE: setup-java's generated settings.xml is NOT what authenticates this
          # build. Every mvn invocation below passes `-s .github/maven-ci-settings.xml`,
          # and `-s` REPLACES the user settings file. The server entries that matter live
          # in that file. These inputs are kept only so the generated file is not
          # misleading to a reader who finds it on the runner.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          # setup-java writes its settings.xml into ~/.m2 unless told otherwise, replacing
          # whatever is there. On the self-hosted runner ~/.m2/settings.xml is a person's own
          # file, so the generated one goes under RUNNER_TEMP, which is emptied after the job.
          settings-path: ${{ runner.temp }}

      # PREFLIGHT - CROSS-REPO PACKAGE READ. This step exists to stop ONE specific
      # misdiagnosis, and that is worth a whole step.
      #
      # The maven steps below resolve net.hugmesh artifacts published from OTHER
      # repositories. secrets.GITHUB_TOKEN is scoped to THIS repository, and GitHub does not
      # hand it cross-repository package access automatically: the build must present a
      # token carrying read:packages, which is the PACKAGES_READ_TOKEN secret (a classic
      # PAT with read:packages; decision 90a = B). GitHub Packages' Maven registry wants a
      # token even for a PUBLIC package, so this stays after the repositories go public.
      # If it is not set, maven fails with
      #     Could not resolve net.hugmesh:hugmesh-parent:pom:2.9.0-beta.1
      # which is the SAME string this repo's RELEASING.md and the comments below teach a
      # reader to interpret as "the upstream is not published yet". A reader who believes
      # that goes and re-publishes an upstream that is already there, and hits the same wall.
      #
      # So: probe the registries first, with the exact credential maven is about to use, and
      # name the failure correctly. A 200 proves this runner can READ that upstream's Maven
      # registry. It does NOT prove the exact version pinned in pom.xml exists - maven says
      # that, accurately, one step later.
      - name: Preflight - cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -uo pipefail
          if [ "${HAS_PACKAGES_READ_TOKEN}" = "true" ]; then
            echo "read credential: secrets.PACKAGES_READ_TOKEN (operator-held PAT)"
          else
            echo "read credential: the automatic secrets.GITHUB_TOKEN (PACKAGES_READ_TOKEN is not set)."
            echo "That token is scoped to THIS repository and may not read the upstream packages."
            echo "Set the PACKAGES_READ_TOKEN secret (classic PAT, read:packages). If the probe"
            echo "below fails, it says so explicitly. RELEASING.md 6.2."
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished'. This runner's credential cannot read that repository's Maven registry. Fix: set the PACKAGES_READ_TOKEN repo secret (classic PAT, read:packages), or share the org secret of that name with this repository. See RELEASING.md 6.2."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). TWO causes look identical here, so do not guess: (a) nothing is published to that registry yet - publish that link first, chain order is build-config, parent, commons, auth-core; or (b) it IS published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything. See RELEASING.md 6.2."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified - do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      # -s .github/maven-ci-settings.xml is LOAD-BEARING. The effective repository list of
      # this project is Maven Central alone (measured: `help:evaluate
      # -Dexpression=project.repositories` returns only `central`), and no net.hugmesh
      # artifact is on Central. That settings file is the ONLY place the GitHub Packages URLs
      # are declared — deliberately not pom.xml, because maven.pkg.github.com answers 401 to
      # an unauthenticated GET and putting it in the pom would break every developer build
      # and hugmesh-generator/tests/stack/m2-bootstrap.sh. See RELEASING.md 3.2 and the
      # header of the settings file itself.
      - name: Build and test
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml -Dmaven.repo.local="${MAVEN_LOCAL_REPO}" verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo READS use their own credential - see the settings file header
          # and RELEASING.md 6.2. Falls back to GITHUB_TOKEN when PACKAGES_READ_TOKEN is
          # unset; the preflight step above reports that case.
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # A published version is never overwritten. 200 = it is already there: stop. 404 = not
      # there yet: go on. Anything else: this token cannot tell, and the deploy below uses the
      # same token, so stop and say so instead of guessing.
      - name: Refuse a version that is already published
        if: needs.version.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          url="https://maven.pkg.github.com/${REPOSITORY}/net/hugmesh/hugmesh-auth-core/${VERSION}/hugmesh-auth-core-${VERSION}.pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "${url}" || echo 000)
          case "${code}" in
            404)
              echo "net.hugmesh:hugmesh-auth-core:${VERSION} is not published yet; deploying it."
              ;;
            200)
              echo "::error::net.hugmesh:hugmesh-auth-core:${VERSION} is ALREADY published. A published version is immutable: raise the beta number (pom.xml, README.md, CHANGELOG.md) and tag again. Nothing deployed."
              exit 1
              ;;
            *)
              echo "::error::HTTP ${code} while checking whether ${VERSION} is already published. Not classified; nothing deployed."
              exit 1
              ;;
          esac

      # -DaltDeploymentRepository is LOAD-BEARING, not decoration. This pom declares no
      # <distributionManagement>, so it inherits hugmesh-parent's, which is
      #   id  gitlab-maven
      #   url ${env.CI_API_V4_URL}/projects/${env.CI_PROJECT_ID}/packages/maven
      # and those ${env.*} placeholders are NOT interpolated off GitLab — the literal
      # string is the URL (measured with help:evaluate; both values are quoted in
      # RELEASING.md 3.1). Without the override this step aims a `gitlab-maven` server id
      # at an uninterpolated URL while the only provisioned credential is for the
      # `github` id. Same shape as the two sibling library repos —
      # hugmesh-parent/.github/workflows/release.yml and
      # hugmesh-build-config/.github/workflows/release.yml.
      - name: Publish jar to GitHub Packages
        if: needs.version.outputs.kind == 'release'
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml -Dmaven.repo.local="${MAVEN_LOCAL_REPO}" deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo READS use their own credential - see the settings file header
          # and RELEASING.md 6.2. Falls back to GITHUB_TOKEN when PACKAGES_READ_TOKEN is
          # unset; the preflight step above reports that case.
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      # --- signed-maven-20261028 ---
      # Everything below signs what the deploy step just published, from this
      # job, by content: the published files are copied under their GitHub
      # Packages file names, SHA256SUMS over them gets a cosign keyless
      # signature (Sigstore, GitHub OIDC) and every file gets a SLSA
      # build-provenance attestation stored by GitHub. SHA256SUMS and the
      # cosign bundle are attached to the GitHub Release, so a consumer can
      # check what the registry serves against a signed list. A run that
      # did not deploy (dispatch on main) signs nothing.
      - name: Collect the published files
        if: needs.version.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release && mkdir release
          cp "target/hugmesh-auth-core-$VERSION.jar" release/
          cp pom.xml "release/hugmesh-auth-core-$VERSION.pom"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        if: needs.version.outputs.kind == 'release'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS (cosign keyless, GitHub OIDC) and check the signature
        # Keyless: the certificate is issued to THIS workflow file at THIS tag by
        # GitHub's OIDC issuer and logged in Sigstore's public transparency log.
        # The check right after uses the identity a consumer would use.
        if: needs.version.outputs.kind == 'release'
        working-directory: release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Attest build provenance for every published file
        if: needs.version.outputs.kind == 'release'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: release/*

      - name: Keep SHA256SUMS and its signature for the GitHub Release
        if: needs.version.outputs.kind == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-signature
          path: |
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 7


  github-release:
    needs: [version, publish]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - name: Fetch SHA256SUMS and its signature from the publish job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-signature
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it as it is."
            exit 0
          fi
          notes="net.hugmesh:hugmesh-auth-core:${VERSION} is published to GitHub Packages (https://github.com/${GH_REPO}/packages). What changed is in CHANGELOG.md. SHA256SUMS lists the published files; SHA256SUMS.sigstore.json is its cosign keyless signature (identity https://github.com/hugmesh/hugmesh-auth-core/.github/workflows/release.yml@refs/tags/${TAG}, issuer https://token.actions.githubusercontent.com); each file also has a GitHub build-provenance attestation (gh attestation verify <file> --repo hugmesh/hugmesh-auth-core)."
          if [ "${PRERELEASE}" = "true" ]; then
            # A beta is a prerelease and never the repository's "latest" release.
            gh release create "${TAG}" --verify-tag --prerelease --latest=false \
              --title "hugmesh-auth-core ${VERSION}" --notes "${notes}" \
              release/SHA256SUMS release/SHA256SUMS.sigstore.json
          else
            gh release create "${TAG}" --verify-tag \
              --title "hugmesh-auth-core ${VERSION}" --notes "${notes}" \
              release/SHA256SUMS release/SHA256SUMS.sigstore.json
          fi
