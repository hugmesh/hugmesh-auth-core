# Manual release: build/test hugmesh-auth-core and publish the library jar to GitHub
# Packages (Maven registry). Mirrors the build:test + deploy:maven stages in this repo's
# .gitlab-ci.yml, ported to the GitHub Packages Maven registry for the hugmesh org.
#
# workflow_dispatch ONLY — intentionally never runs on push/tag. Stays fully inert until a
# human enables it.
#
# READ RELEASING.md BEFORE RUNNING THIS. As of 2026-09-16 it has never run
# (`gh run list --repo hugmesh/hugmesh-auth-core` → empty) and the `Build and test` step
# below is still expected to FAIL on a clean runner: the effective repository list is Maven
# Central alone, and net.hugmesh:hugmesh-parent:2.8.0 / hugmesh-commons:2.1.0 /
# hugmesh-build-config:0.5.0 are all 404 there and unpublished on GitHub Packages. That is
# RELEASING.md §3.2 and it is NOT fixed here — fixing it needs the upstream chain published
# plus a CI-only resolution route, which is an open design call.
name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Populates a <server> entry for this id in the generated settings.xml, using
          # the env vars below for username/password — no hand-rolled settings.xml auth.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # -DaltDeploymentRepository is LOAD-BEARING, not decoration. This pom declares no
      # <distributionManagement>, so it inherits hugmesh-parent's, which is
      #   id  gitlab-maven
      #   url ${env.CI_API_V4_URL}/projects/${env.CI_PROJECT_ID}/packages/maven
      # and those ${env.*} placeholders are NOT interpolated off GitLab — the literal
      # string is the URL (measured with help:evaluate; both values are quoted in
      # RELEASING.md §3.1). Without the override this step aims a `gitlab-maven` server id
      # at an uninterpolated URL while setup-java has provisioned credentials for the
      # `github` id only: wrong registry AND wrong credential. Same shape as the two
      # sibling library repos — hugmesh-parent/.github/workflows/release.yml:24 and
      # hugmesh-build-config/.github/workflows/release.yml:37.
      - name: Publish jar to GitHub Packages
        run: ./mvnw -B -ntp deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
